name: Deploy APK Landing Page

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - Admin/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Admin/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve Admin API base URL
        shell: bash
        env:
          AZURE_API_BASE_URL: ${{ secrets.AZURE_API_BASE_URL }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail

          if [ -n "${AZURE_API_BASE_URL:-}" ]; then
            trimmed_base_url="${AZURE_API_BASE_URL%/}"
            if [[ "${trimmed_base_url}" == */api ]]; then
              admin_api_base_url="${trimmed_base_url}"
            else
              admin_api_base_url="${trimmed_base_url}/api"
            fi
          elif [ -n "${AZURE_WEBAPP_NAME:-}" ]; then
            admin_api_base_url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/api"
          else
            echo "Missing AZURE_API_BASE_URL or AZURE_WEBAPP_NAME secret. Set AZURE_API_BASE_URL to the live Azure backend base URL, or AZURE_WEBAPP_NAME if you want the workflow to derive the default azurewebsites.net URL."
            exit 1
          fi

          echo "VITE_API_BASE_URL=${admin_api_base_url}" >> "$GITHUB_ENV"
          mkdir -p Admin/public
          cat > Admin/public/runtime-config.js <<EOF
          window.HANDKRAFT_ADMIN_CONFIG = {
            apiBaseUrl: "${admin_api_base_url}"
          };
          EOF

      - name: Install Admin dependencies
        run: npm ci --prefix Admin

      - name: Build Admin app for GitHub Pages
        run: npm --prefix Admin run build -- --base=./

      - name: Assemble Pages artifact (docs + admin)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/admin
          cp -R docs/. _site/
          cp -R Admin/dist/. _site/admin/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
